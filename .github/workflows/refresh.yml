name: Refresh stars and links

# Separate from CI on purpose. This runs on a schedule, not on every push,
# and it needs permission to commit the updated JSON files back to the repo.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh star counts and check connector links
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/repos.json src/data/linkstatus.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/repos.json src/data/linkstatus.json
          git commit -m "chore: refresh stars and link status"
          git push
